server {
    listen       80;
    server_name  localhost;

    # 使用Docker内部DNS服务器进行服务名解析（延迟解析）
    # 127.0.0.11 是Docker容器内部的DNS服务器
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # 前端静态资源目录
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # 字符集
    charset utf-8;

    # 日志配置
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # 前端静态文件配置
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存配置
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API代理配置 - 将前端API请求代理到后端服务
    # 后端服务地址：zhurong-ems-backend:8088
    # 后端context-path：/autoee-iot-ems

    # 直接代理到后端context-path（如果前端API路径就是 /autoee-iot-ems/）
    # 使用变量实现DNS延迟解析，避免启动时无法解析服务名
    location /autoee-iot-ems/ {
        # 使用变量来延迟DNS解析（配合resolver使用）
        set $backend "zhurong-ems-backend:8088";
        proxy_pass http://$backend;

        # 代理请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 如果前端使用 /dev-api/ 或 /prod-api/ 作为API前缀，可以使用以下配置
    # 注意：需要根据前端实际构建时的 VUE_APP_BASE_API 环境变量来配置
    # 例如：如果 VUE_APP_BASE_API=/dev-api/，则取消下面的注释
    # location /dev-api/ {
    #     proxy_pass http://zhurong-ems-backend:8088/autoee-iot-ems/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_http_version 1.1;
    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 60s;
    #     proxy_read_timeout 60s;
    #     proxy_buffering off;
    #     proxy_request_buffering off;
    # }

    # 如果前端使用的API路径不是 /autoee-iot-ems/，可以根据实际前端配置调整
    # 例如，如果前端使用 /dev-api/ 或 /prod-api/ 作为API前缀
    # 可以通过环境变量 VUE_APP_BASE_API 来配置，然后在nginx中做相应代理

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 错误页面
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

