# Docker 容器环境配置
# 此配置文件专门用于 Docker 容器部署
# 通过 SPRING_PROFILES_ACTIVE=docker 激活

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      p6spy: false
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://zhurong-ems-mysql:3306/autoee_ems?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
          username: root
          password: ${SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD:root}

--- # Redis 配置 - 使用Docker服务名
spring:
  redis:
    host: zhurong-ems-redis
    port: 6379
    password: ${SPRING_REDIS_PASSWORD:difyyai123456}
    database: 13
    timeout: 10s
    ssl: false

redisson:
  keyPrefix:
  threads: 64
  nettyThreads: 64
  singleServerConfig:
    clientName: ${zhurong-ems.name}
    connectionMinimumIdleSize: 16
    connectionPoolSize: 128
    idleConnectionTimeout: 1000
    timeout: 3000
    subscriptionConnectionPoolSize: 320

--- # RabbitMQ 配置 - 使用Docker服务名
spring:
  rabbitmq:
    host: zhurong-ems-rabbitmq
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true

--- # MQTT 配置
mqtt:
  host: tcp://zhurong-ems-emqx:1883
  username: admin
  password: public
  clientId: docker-client-zhurong-ems
  qos: 1
  timeout: 120
  keepalive: 360